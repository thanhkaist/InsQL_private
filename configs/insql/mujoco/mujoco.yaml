defaults:
  - _self_
  - task: halfcheetah-medium-expert-v2

pipeline_name: insql_d4rl_mujoco
mode: train
seed: 0
device: cuda:0
project: InsQL
group: Default
name: Default
enable_wandb: false
save_dir: results

# Environment
normalize_reward: True
discount: 0.99

# Actor
solver: euler
train_sampling_steps: 1
sampling_steps: 1
ema_rate: 0.995
actor_learning_rate: 0.0003
flow_ratio: 0.5            # lambda in the paper: P(boundary objective) vs compositional

# Critic
hidden_dim: 256
critic_learning_rate: 0.0003

# Training
gradient_steps: 2000000
batch_size: 256
ema_update_interval: 5
log_interval: 1000
save_interval: 100000
eval_interval: 50000
time_dist: "uniform" # "lognorm"
adaptive_l2_loss: 0
warm_up_steps: 1

# Inference
ckpt: latest
num_envs: 50
num_episodes: 3
num_candidates: 5
temperature: 1.0
use_ema: False

# hydra
hydra:
  job:
    chdir: false

